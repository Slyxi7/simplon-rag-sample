global:
  resolve_timeout: 5m

route:
  receiver: 'discord-webhook'
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: 'discord-webhook'
      continue: true
    - match:
        severity: warning
      receiver: 'discord-webhook'

receivers:
  - name: 'discord-webhook'
    webhook_configs:
      - url: 'http://discord-webhook:9094'
        send_resolved: true
